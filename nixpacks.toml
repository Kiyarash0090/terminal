# Railway Nixpacks Configuration
[phases.setup]
nixPkgs = [
  "git",
  "nodejs_20",
  "python3",
  "python3Packages.pip",
  "ffmpeg",
  "curl",
  "unzip",
  "cacert",
  "proxychains-ng",
  "tini",
  "procps"
]

[phases.install]
cmds = [
  "git clone https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /opt/bgutil || (cd /opt/bgutil && git pull)",
  "cd /opt/bgutil/server && npm install && (npx tsc || true)",
  "pip install --break-system-packages /opt/bgutil/plugin || pip install /opt/bgutil/plugin || true",
  "npm install",
  "pip install -r requirements.txt"
]
